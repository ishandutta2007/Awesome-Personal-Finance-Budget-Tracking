<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <!-- Accent Gradient for Title -->
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.6" />
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 44px;
        fill: url(#titleGradient);
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 17px;
        fill: #94a3b8;
        letter-spacing: 0.5px;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #e2e8f0;
      }

      /* Dynamic Animations in Background */
      @keyframes floatSlow {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1.5deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }
      @keyframes floatReverse {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(10px) rotate(-1.5deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 0.7; }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -40; }
      }

      .floating-card-1 {
        animation: floatSlow 6s ease-in-out infinite;
      }
      .floating-card-2 {
        animation: floatReverse 7s ease-in-out infinite;
      }
      .pulse-circle {
        animation: pulseGlow 4s ease-in-out infinite;
      }
      .animated-dash {
        stroke-dasharray: 6 6;
        animation: dashMove 2s linear infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" rx="16" fill="url(#bgGradient)" />

  <!-- Ambient Light / Glow Spheres (Background) -->
  <circle cx="200" cy="80" r="130" fill="#38bdf8" opacity="0.12" filter="url(#glow)" class="pulse-circle" />
  <circle cx="1020" cy="260" r="140" fill="#34d399" opacity="0.1" filter="url(#glow)" class="pulse-circle" />
  <circle cx="600" cy="300" r="160" fill="#818cf8" opacity="0.08" filter="url(#glow)" class="pulse-circle" />

  <!-- Background Financial Trend Lines -->
  <path d="M 50 280 Q 200 240, 350 270 T 650 220 T 950 160 T 1150 110" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.25" />
  <path d="M 50 280 Q 200 240, 350 270 T 650 220 T 950 160 T 1150 110" fill="none" stroke="#34d399" stroke-width="2" opacity="0.4" class="animated-dash" />

  <!-- Left Dynamic Element (Pill Card) -->
  <g class="floating-card-1" transform="translate(60, 50)">
    <rect width="180" height="64" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5" />
    <circle cx="32" cy="32" r="14" fill="#0284c7" fill-opacity="0.4" />
    <text x="32" y="37" font-size="14" text-anchor="middle" fill="#38bdf8">💳</text>
    <text x="60" y="27" class="badge-text">Envelope Sync</text>
    <text x="60" y="47" font-family="sans-serif" font-size="11" fill="#34d399" font-weight="600">+100% Local-First</text>
  </g>

  <!-- Right Dynamic Element (Balance Card) -->
  <g class="floating-card-2" transform="translate(940, 60)">
    <rect width="190" height="74" rx="12" fill="url(#cardGrad)" stroke="#34d399" stroke-opacity="0.3" stroke-width="1.5" />
    <circle cx="34" cy="37" r="15" fill="#059669" fill-opacity="0.3" />
    <text x="34" y="42" font-size="15" text-anchor="middle" fill="#34d399">📈</text>
    <text x="64" y="32" class="badge-text">Net Worth Index</text>
    <text x="64" y="52" font-family="sans-serif" font-size="11" fill="#94a3b8">FIRE Projections 🎯</text>
  </g>

  <!-- Foreground Title and Subtitle -->
  <g id="foreground-content">
    <!-- Icon Pill Header -->
    <g transform="translate(600, 75)">
      <rect x="-140" y="-16" width="280" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <circle cx="-118" cy="0" r="6" fill="#22c55e" />
      <text x="0" y="5" font-family="sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="1">CURATED FINTECH &amp; BUDGETING</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="150" text-anchor="middle" class="title-text">Awesome Personal Finance &amp; Budget Tracking</text>

    <!-- Subtitle -->
    <text x="600" y="195" text-anchor="middle" class="subtitle-text">The Complete Ecosystem for Zero-Based Budgeting, Plain-Text Accounting &amp; Wealth Management</text>

    <!-- Feature Pills at Bottom -->
    <g transform="translate(600, 260)">
      <!-- Pill 1 -->
      <g transform="translate(-320, 0)">
        <rect x="-80" y="-18" width="160" height="36" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
        <text x="0" y="5" class="badge-text" text-anchor="middle">⚡ Zero-Based Envelope</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(-105, 0)">
        <rect x="-80" y="-18" width="160" height="36" rx="18" fill="#1e293b" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1" />
        <text x="0" y="5" class="badge-text" text-anchor="middle">🛡️ 100% Privacy &amp; Local</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(105, 0)">
        <rect x="-80" y="-18" width="160" height="36" rx="18" fill="#1e293b" stroke="#34d399" stroke-opacity="0.4" stroke-width="1" />
        <text x="0" y="5" class="badge-text" text-anchor="middle">📊 Plain-Text Double Entry</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(320, 0)">
        <rect x="-80" y="-18" width="160" height="36" rx="18" fill="#1e293b" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1" />
        <text x="0" y="5" class="badge-text" text-anchor="middle">🔥 FIRE Analytics</text>
      </g>
    </g>
  </g>
</svg>